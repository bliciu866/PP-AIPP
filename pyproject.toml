[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pp-aipp"
version = "3.0.0b9"
description = "Project Physique AI Publishing Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Project Physique"}]
dependencies = [
    "PyYAML>=6.0",
    "python-docx>=1.1.0",
    "reportlab>=4.2",
    "Pillow>=10.4",
    "openai>=1.54,<3",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.7,<7"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
pp-aipp = "pp_aipp.cli:main"
pp-aipp-desktop = "pp_aipp.desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pp_aipp = ["resources/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
