name: PP-AIPP Python 3.13 Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pp-aipp-python-313-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Optional compatibility / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile source
        run: python -m compileall -q src

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Run tests
        run: python -m pytest -q

      - name: CLI smoke test
        run: |
          pp-aipp doctor
          pp-aipp verify --skip-gold-master --skip-lint --report-dir reports/python-313

      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compatibility-python-3.13
          path: reports/python-313
          if-no-files-found: warn
          retention-days: 7
