name: Build PP-AIPP Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install PP-AIPP and build dependencies
        run: python -m pip install -e ".[desktop,dev,build]"

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Run tests
        run: python -m pytest -q

      - name: Build Windows executable
        run: pyinstaller --clean --noconfirm PP-AIPP.spec

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/PP-AIPP.exe")) {
            throw "PP-AIPP.exe was not produced"
          }
          $size = (Get-Item "dist/PP-AIPP.exe").Length
          if ($size -lt 1000000) {
            throw "PP-AIPP.exe is unexpectedly small: $size bytes"
          }
          Write-Host "PP-AIPP.exe size: $size bytes"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item dist/PP-AIPP.exe package/PP-AIPP.exe
          Copy-Item SETUP_LOCAL_AI.bat package/SETUP_LOCAL_AI.bat
          Copy-Item scripts/local_ai_runner.py package/local_ai_runner.py
          if (Test-Path README.md) { Copy-Item README.md package/README.md }
          if (Test-Path LICENSE) { Copy-Item LICENSE package/LICENSE }
          Compress-Archive -Path package/* -DestinationPath PP-AIPP-Windows-Portable.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PP-AIPP-Windows-beta.11-B3.4
          path: |
            dist/PP-AIPP.exe
            PP-AIPP-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30
