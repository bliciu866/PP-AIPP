name: PP-AIPP Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pp-aipp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.11 and 3.12 are the supported release gate. Python 3.13 is
        # checked separately by the manually triggered compatibility workflow,
        # so a temporarily unavailable runner cannot block every release job.
        python-version: ["3.11", "3.12"]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile source
        run: python -m compileall -q src

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=pp_aipp --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: CLI smoke test
        run: |
          pp-aipp doctor
          pp-aipp verify --skip-gold-master --skip-lint --report-dir reports/ci

      - name: Release gate
        run: python scripts/release_gate.py

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-python-${{ matrix.python-version }}
          path: |
            reports/ci
            coverage.xml
          if-no-files-found: warn
          retention-days: 14

  package-smoke:
    name: Package smoke test
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel and source archive
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Install wheel in clean virtual environment
        run: |
          python -m venv .package-test
          .package-test/bin/python -m pip install dist/*.whl
          .package-test/bin/pp-aipp doctor
      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: pp-aipp-package
          path: dist/*
          retention-days: 14

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs: [quality, package-smoke]
    timeout-minutes: 5
    steps:
      - name: All required checks passed
        run: echo "PP-AIPP release gate passed."
